<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Run</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell" aria-label="Neon Run game">
      <canvas id="gameCanvas" aria-label="Endless runner game canvas"></canvas>

      <section class="hud" aria-live="polite">
        <div class="metric">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="metric">
          <span>Distance</span>
          <strong><b id="distance">0</b>m</strong>
        </div>
        <div class="metric">
          <span>Coins</span>
          <strong id="coins">0</strong>
        </div>
        <div class="metric">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </section>

      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="kicker">Subway Surfers-lite</p>
          <h1 id="overlayTitle">Neon Run</h1>
          <p id="overlayText">Dodge, jump, slide, and collect coins across three lanes.</p>
          <button id="primaryButton" type="button">Start Run</button>
          <p class="controls">Arrow keys / WASD. P pauses. Swipe on mobile.</p>
        </div>
      </div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
